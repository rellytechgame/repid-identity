version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      electron-toolchain:
        patterns: ["electron", "electron-*", "vite", "@vitejs/*"]
      react:
        patterns: ["react", "react-dom", "@types/react*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
