name: Release

# Push a tag like v1.0.0 to build installers on all three OSes and attach them to a draft GitHub Release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # upload assets to the draft release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and publish
        run: npx electron-vite build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing is skipped until certificates are configured as repository secrets (CSC_LINK / CSC_KEY_PASSWORD, APPLE_ID…).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
